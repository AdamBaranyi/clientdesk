name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://tallyroom:tallyroom_local@localhost:5432/tallyroom_test

jobs:
  qualitaet:
    name: Format, Dateilänge, Lint, Typen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Formatprüfung
        run: bun run format:check

      # Feste Projektregel: keine projekteigene Code-Datei über 400 Zeilen.
      - name: Dateilängenprüfung
        run: bun run check:file-length

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  tests:
    name: Tests gegen echte Datenbank
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: tallyroom
          POSTGRES_PASSWORD: tallyroom_local
          POSTGRES_DB: tallyroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tallyroom -d tallyroom_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Migrationen laufen im Testlauf selbst; hier wird nur geprüft, dass die
      # Datenbank erreichbar ist, bevor die Suite startet.
      # Blockskalar, weil der Einzeiler ein ": " enthält und YAML das sonst
      # als Zuordnung liest.
      - name: Datenbank erreichbar
        run: |
          bun --eval "
            const { createPool } = await import('@tallyroom/db');
            const pool = createPool({ connectionString: process.env.TEST_DATABASE_URL });
            await pool.query('SELECT 1');
            await pool.end();
            console.log('Datenbank erreichbar.');
          "

      - name: Tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Weboberfläche bauen
        run: bun run --filter '@tallyroom/web' build
