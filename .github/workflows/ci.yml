name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://tallyroom:tallyroom_local@localhost:5432/tallyroom_test

jobs:
  qualitaet:
    name: Format, Dateilänge, Lint, Typen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Formatprüfung
        run: bun run format:check

      # Feste Projektregel: keine projekteigene Code-Datei über 400 Zeilen.
      - name: Dateilängenprüfung
        run: bun run check:file-length

      # Feste Projektregel: keine Schrift unter 16 px. Den Browser prüft e2e/font-size.spec.ts.
      - name: Schriftgrössenprüfung
        run: bun run check:font-floor

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  tests:
    name: Tests gegen echte Datenbank
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: tallyroom
          POSTGRES_PASSWORD: tallyroom_local
          POSTGRES_DB: tallyroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tallyroom -d tallyroom_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Migrationen laufen im Testlauf selbst; hier wird nur geprüft, dass die
      # Datenbank erreichbar ist, bevor die Suite startet.
      # Blockskalar, weil der Einzeiler ein ": " enthält und YAML das sonst
      # als Zuordnung liest.
      - name: Datenbank erreichbar
        run: |
          bun --eval "
            const { createPool } = await import('@tallyroom/db');
            const pool = createPool({ connectionString: process.env.TEST_DATABASE_URL });
            await pool.query('SELECT 1');
            await pool.end();
            console.log('Datenbank erreichbar.');
          "

      - name: Tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Baut die Oberfläche und misst sie gegen das Budget in
      # scripts/check-bundle-size.mjs. Über der Grenze ist der Build rot.
      - name: Weboberfläche bauen, Auslieferungsgrösse prüfen
        run: bun run check:bundle-size

  sicherheit:
    name: Secret-Scan und Abhängigkeiten
    runs-on: ubuntu-24.04
    steps:
      # Die ganze Historie, nicht nur der letzte Stand: ein Geheimnis, das in
      # einem alten Commit steht, ist im öffentlichen Repository weiter lesbar.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Hält fest, dass wirklich die ganze Historie da ist. Ein flacher Checkout
      # hätte genau einen Commit, und der Scan sähe grün aus, ohne es zu sein.
      - name: Historie vollständig
        run: |
          count=$(git rev-list --count HEAD)
          echo "Commits im Checkout: $count"
          test "$count" -gt 1

      # Binärdatei statt Action, mit geprüfter Prüfsumme aus dem Release.
      - name: gitleaks 8.30.1 holen
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      # Ausnahmen stehen einzeln in .gitleaksignore, begründet in docs/SECURITY.md.
      - name: Secret-Scan über alle Commits
        run: ./gitleaks git . --no-banner --redact --gitleaks-ignore-path .gitleaksignore

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Blockiert ab "hoch". Ein Netzwerk- oder Scannerfehler endet ebenfalls
      # rot und zählt nicht als bestanden.
      - name: Bekannte Schwachstellen, blockierend ab hoch
        run: bun audit --audit-level=high

      # Zeigt auch moderate und niedrige Befunde, damit sie im Protokoll und in
      # der Laufzusammenfassung stehen. Bewertet sind sie einzeln in
      # docs/SECURITY.md.
      #
      # Der Exit-Code fällt hier bewusst weg. Vorher trug dieser Schritt
      # `continue-on-error`, und ein grüner Lauf zeigte trotzdem eine rote
      # Fehlermarkierung — wer die gewöhnt ist, übersieht irgendwann die echte.
      # Geurteilt wird im Schritt darüber. Bei gitleaks wäre dasselbe ein
      # Fehler: dort gibt es keinen zweiten Schritt, der blockiert.
      - name: Alle Befunde zur Ansicht
        run: |
          {
            echo '### bun audit, alle Stufen'
            echo ''
            echo '```'
            bun audit 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Playwright über sechs Breiten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Datenbanken und Objektspeicher starten
        run: docker compose -f infra/docker-compose.yml up -d --wait

      # Die Vorlage mit einem eigenen Sitzungsschlüssel für diesen Lauf. Den
      # Platzhalter würde die API beim Start ablehnen.
      - name: Umgebung für den Lauf
        run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -base64 48)|" .env

      - name: Migrationen
        run: bun run db:migrate

      - name: Chromium installieren
        run: bunx playwright install --with-deps chromium

      - name: Playwright
        run: bun run test:e2e

      - name: Spuren bei Fehlschlag
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-spuren
          path: test-results/
          retention-days: 7

  produktion:
    name: Produktionsaufbau von aussen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Erzeugt nur für diesen Lauf und nie gespeichert. Die echten Werte
      # stehen ausschliesslich auf dem Server.
      - name: Geheimnisse für diesen Lauf
        run: |
          cat > "$RUNNER_TEMP/prod.env" <<EOF
          SITE_ADDRESS=localhost
          APP_ORIGIN=https://localhost:8443
          HTTP_PORT=8080
          HTTPS_PORT=8443
          SESSION_SECRET=$(openssl rand -base64 48)
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          GARAGE_RPC_SECRET=$(openssl rand -hex 32)
          S3_ACCESS_KEY_ID=GK$(openssl rand -hex 12)
          S3_SECRET_ACCESS_KEY=$(openssl rand -hex 32)
          OPERATOR_STREET="Teststrasse 1"
          OPERATOR_CITY="0000 Testort"
          OPERATOR_EMAIL="impressum@example.invalid"
          TALLYROOM_VERSION=ci
          EOF

      # Dieselbe Reihenfolge wie auf dem Server: Daten, Migration, Anwendung.
      - name: Images bauen und starten
        run: |
          compose="docker compose -f infra/compose.prod.yml --env-file $RUNNER_TEMP/prod.env"
          $compose build
          $compose up -d --wait postgres garage
          $compose --profile tools run --rm migrate
          $compose up -d --wait

      - name: Chromium installieren
        run: bunx playwright install --with-deps chromium

      - name: Header, CSP und Demo-Durchgang
        run: bunx playwright test -c playwright.production.config.ts

      - name: Protokolle bei Fehlschlag
        if: failure()
        run: docker compose -f infra/compose.prod.yml --env-file "$RUNNER_TEMP/prod.env" logs --no-color --tail 200
