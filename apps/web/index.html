<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Muss vor dem Einstieg laufen, Begründung in der Datei. -->
    <script defer src="/zod-jitless.js"></script>
    <title>Tallyroom · Kundenübersicht und Kundenportal für kleine Agenturen</title>
    <meta
      name="description"
      content="Kunden, Projekte, Servicevereinbarungen, Anfragen und Dokumente an einem Ort, dazu ein getrenntes Kundenportal. Portfolio-Projekt mit einer Demo, die jeder starten kann."
    />
    <!--
      Vorschau beim Teilen eines Links. Messenger und Netzwerke führen kein
      JavaScript aus, darum stehen die Angaben hier statisch und gelten für
      jede Adresse. Das Bild erzeugt scripts/capture-og-image.ts aus der
      echten Startseite.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tallyroom" />
    <meta property="og:locale" content="de_CH" />
    <meta property="og:url" content="https://tallyroom.adambaranyi.xyz/" />
    <meta
      property="og:title"
      content="Tallyroom · Kundenübersicht und Kundenportal für kleine Agenturen"
    />
    <meta
      property="og:description"
      content="Portfolio-Projekt mit einer Demo, die jeder starten kann: 60 Minuten, eigener Datenbestand, danach gelöscht."
    />
    <meta property="og:image" content="https://tallyroom.adambaranyi.xyz/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Startseite von Tallyroom mit Überschrift und den Kenndaten der Demo"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Farbe der Browserleiste auf Android; folgt den beiden Wertesätzen. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0efeb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141310" />
    <!--
      Schriften liegen unter /fonts und kommen nicht mehr von Google. Warum,
      steht in src/styles/fonts.css.

      Vorgeladen werden nur die beiden Schnitte, die auf jeder Seite oben
      stehen: Fliesstext und der halbfette Schnitt für Überschriften. Alles
      vorzuladen hiesse, nichts zu bevorzugen.
    -->
    <link rel="preload" href="/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-sans-600.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
