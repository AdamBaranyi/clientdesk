<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ClientDesk</title>
    <meta name="description" content="Kundenportal und Übersicht für kleine Digitalagenturen." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Farbe der Browserleiste auf Android; folgt den beiden Wertesätzen. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0efeb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141310" />
    <!--
      Schriften liegen unter /fonts und kommen nicht mehr von Google. Warum,
      steht in src/styles/fonts.css.

      Vorgeladen werden nur die beiden Schnitte, die auf jeder Seite oben
      stehen: Fliesstext und der halbfette Schnitt für Überschriften. Alles
      vorzuladen hiesse, nichts zu bevorzugen.
    -->
    <link rel="preload" href="/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-sans-600.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
