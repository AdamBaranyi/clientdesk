<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ClientDesk">
  <!--
    Das Zeichen ist die Messlatte aus dem Kennzahlband: Grundlinie, vier
    Balken, der letzte in Kobalt. Kein Symbol aus einer Bibliothek, und
    keine Buchstaben — bei 16 Pixeln bleibt von einem Monogramm nichts
    übrig, von vier Balken schon.

    Kobalt trägt hier den Datenbalken. Das ist die erlaubte Verwendung,
    nicht der Sonderfall.
  -->
  <rect width="32" height="32" fill="#191813" />
  <g fill="#f6f5f2">
    <rect x="5" y="24" width="22" height="1.5" />
    <rect x="6" y="18" width="3" height="6" />
    <rect x="11" y="14" width="3" height="10" />
    <rect x="16" y="10" width="3" height="14" />
  </g>
  <rect x="21" y="6" width="3" height="18" fill="#5b82f5" />
</svg>
