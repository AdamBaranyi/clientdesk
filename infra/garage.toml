# Garage als S3-kompatibler Objektspeicher auf einem einzelnen Rechner.
# Gilt lokal und auf dem Server. Geheimnisse stehen nicht hier, sondern kommen
# aus der Umgebung: GARAGE_RPC_SECRET sowie Schlüssel und Bucket über
# GARAGE_DEFAULT_ACCESS_KEY, GARAGE_DEFAULT_SECRET_KEY, GARAGE_DEFAULT_BUCKET.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

# SQLite statt LMDB: LMDB kann nach einem harten Abbruch beschädigt sein.
db_engine = "sqlite"
# Wenige, kleine Schreibvorgänge. Haltbarkeit geht hier vor Tempo.
metadata_fsync = true
data_fsync = true

replication_factor = 1

# Nur im Container-Netz. Der RPC-Port wird nie veröffentlicht.
rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Muss zu S3_REGION in der .env passen, sonst stimmt keine Signatur.
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
