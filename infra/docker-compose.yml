name: clientdesk

# Ports 5440/5441 statt der Standard-5432: auf diesem Rechner laufen weitere
# Postgres-Container anderer Projekte. Postgres 18 erwartet den Mount auf
# /var/lib/postgresql, nicht mehr auf dem data-Unterverzeichnis.

services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clientdesk
      POSTGRES_PASSWORD: clientdesk_local
      POSTGRES_DB: clientdesk
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clientdesk -d clientdesk']
      interval: 5s
      timeout: 3s
      retries: 10

  # Eigene Instanz für Integrationstests. tmpfs, damit jeder Lauf sauber startet
  # und Testdaten nie neben den Entwicklungsdaten landen.
  postgres_test:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clientdesk
      POSTGRES_PASSWORD: clientdesk_local
      POSTGRES_DB: clientdesk_test
    ports:
      - '127.0.0.1:5441:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clientdesk -d clientdesk_test']
      interval: 5s
      timeout: 3s
      retries: 10

  # Objektspeicher für Dokumente. Der Bucket ist privat; Dateien sind
  # ausschliesslich über die autorisierte API erreichbar, nie über eine URL.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clientdesk
      MINIO_ROOT_PASSWORD: clientdesk_local_secret
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Legt den Bucket einmalig an und beendet sich wieder.
  minio_init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 clientdesk clientdesk_local_secret &&
      mc mb --ignore-existing local/clientdesk-documents &&
      mc anonymous set none local/clientdesk-documents &&
      echo 'Bucket bereit.'
      "

volumes:
  postgres_data:
  minio_data:
